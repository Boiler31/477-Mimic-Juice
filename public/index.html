<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - mimic_juice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Login</h1>
    <div id="form-message" class="banner" role="alert" hidden></div>
    <form id="login-form" novalidate>
      <label for="email">Email *</label>
      <input id="email" name="email" type="text" autocomplete="username" placeholder="Email address">
      <p class="error" id="email-error"></p>

      <label for="password">Password *</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password">
      <p class="error" id="password-error"></p>

      <button type="submit" id="login-button">Log in</button>
    </form>
  </main>
  <script src="validate.js"></script>
  <script src="app.js"></script>
</body>
</html>
